<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NexGen ERP</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Pre-paint theme resolution. This cannot live in Angular: it must run
      before the bundle is parsed, or a dark-mode user sees a white flash
      (KB-051 / M2-C04-01). Keep it in sync with ThemeService - same
      localStorage keys, same attribute names.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nexgen.theme');
          var d = localStorage.getItem('nexgen.density');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute(
            'data-density',
            d === 'compact' ? 'compact' : 'default',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      M2-C02 — the "status === 'unknown'" skeleton, outside Angular entirely. The bootstrap
      auth check (AuthService.bootstrap(), run from provideAppInitializer in app.config.ts)
      blocks Angular's root component from rendering at all until status settles to
      'anonymous' or 'authenticated' — so without this, a hard refresh shows a blank white
      body for that window instead of a themed loading state. Angular replaces this content
      wholesale the moment app-root bootstraps; nothing here is Angular-aware or needs to be
      removed by hand. Uses the same CSS custom properties the token layer defines
      (KB-051/M2-C04-01) so it matches the pre-painted theme above, never a hardcoded colour.
    -->
    <app-root>
      <div class="app-boot-skeleton" role="status" aria-live="polite" aria-label="Loading">
        <span class="app-boot-skeleton__spinner"></span>
      </div>
    </app-root>
    <style>
      .app-boot-skeleton {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg-surface, canvas);
      }
      .app-boot-skeleton__spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 3px solid var(--border, graytext);
        border-top-color: var(--accent, highlight);
        animation: app-boot-skeleton-spin 0.8s linear infinite;
      }
      @keyframes app-boot-skeleton-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
