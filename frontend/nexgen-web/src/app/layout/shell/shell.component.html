@if (bootstrapping()) {
  <div class="app-shell-skeleton" role="status" aria-label="Loading the application shell">
    <app-skeleton class="app-shell-skeleton__header" width="100%" height="var(--header-height)" />
    <div class="app-shell-skeleton__body">
      <app-skeleton
        class="app-shell-skeleton__sidebar"
        width="var(--sidebar-width)"
        height="100%"
      />
      <app-skeleton class="app-shell-skeleton__content" width="100%" height="100%" />
    </div>
  </div>
} @else {
  <div class="app-shell">
    <a class="app-shell__skip-link" href="#app-shell-main">Skip to content</a>

    <app-header
      class="app-shell__header"
      [userName]="userName()"
      [tenantName]="tenantName()"
      (menuToggled)="onMenuToggled()"
      (searchRequested)="paletteVisible.set(true)"
      (logoutRequested)="onLogout()"
    />

    <div class="app-shell__body">
      @if (isOverlaySidebar()) {
        <p-drawer [(visible)]="mobileNavOpen" position="left" styleClass="app-shell__drawer">
          <app-sidebar mode="expanded" />
        </p-drawer>
      } @else {
        <app-sidebar class="app-shell__sidebar" [mode]="sidebarMode()" />
      }

      <main id="app-shell-main" class="app-shell__content" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>

  <app-command-palette [(visible)]="paletteVisible" (navigated)="onPaletteNavigated($event)" />
}
