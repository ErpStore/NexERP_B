<a
  class="app-nav-item"
  [class.app-nav-item--rail]="rail()"
  [routerLink]="link().route"
  routerLinkActive="app-nav-item--active"
  ariaCurrentWhenActive="page"
  (click)="onClick()"
>
  @if (rail()) {
    <span class="app-nav-item__rail-glyph" aria-hidden="true">{{ link().label.charAt(0) }}</span>
  }
  <span class="app-nav-item__label">{{ link().label }}</span>
  <button
    type="button"
    class="app-nav-item__favourite"
    [class.app-nav-item__favourite--active]="favourite()"
    [attr.aria-pressed]="favourite()"
    [attr.aria-label]="(favourite() ? 'Remove ' : 'Add ') + link().label + ' from Favourites'"
    (click)="onFavouriteClick($event)"
  >
    ★
  </button>
</a>
