<button
  type="button"
  class="app-user-menu__trigger"
  aria-haspopup="menu"
  [attr.aria-label]="'Account menu for ' + userName()"
  (click)="toggle($event)"
>
  <span class="app-user-menu__avatar" aria-hidden="true">{{ userName().charAt(0) }}</span>
  <span class="app-user-menu__name">{{ userName() }}</span>
  <i class="pi pi-chevron-down" aria-hidden="true"></i>
</button>

<app-popover #menu label="Account menu">
  <div class="app-user-menu__panel" role="menu" aria-label="Account menu">
    <ng-content select="[appUserMenuExtra]" />
    <button type="button" class="app-user-menu__item" role="menuitem" (click)="onLogoutClick()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      Log out
    </button>
  </div>
</app-popover>
