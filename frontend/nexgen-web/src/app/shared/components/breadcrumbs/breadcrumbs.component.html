<nav class="app-breadcrumbs" aria-label="Breadcrumb">
  <ol class="app-breadcrumbs__list">
    @for (item of items(); track item.label + (item.url ?? ''); let last = $last) {
      <li class="app-breadcrumbs__item">
        @if (item.url && !last) {
          <a class="app-breadcrumbs__link" [routerLink]="item.url">{{ item.label }}</a>
        } @else {
          <span class="app-breadcrumbs__current" aria-current="page">{{ item.label }}</span>
        }
        @if (!last) {
          <span class="app-breadcrumbs__separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
