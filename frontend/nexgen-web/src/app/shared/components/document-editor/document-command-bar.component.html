<div class="document-command-bar" role="toolbar" aria-label="Document actions">
  <p class="document-command-bar__state">
    @if (dirty()) {
      <span class="document-command-bar__dirty">
        <span class="document-command-bar__dot" aria-hidden="true"></span>
        Unsaved changes
      </span>
    }
  </p>

  <button
    type="button"
    class="document-command-bar__button"
    [disabled]="saving()"
    (click)="cancelled.emit()"
  >
    Cancel
  </button>

  <div class="document-command-bar__commands">
    @if (commandsTemplate(); as slot) {
      <ng-container *ngTemplateOutlet="slot" />
    }
  </div>

  @if (mode() !== 'view') {
    <button
      type="button"
      class="document-command-bar__button document-command-bar__button--primary"
      [disabled]="saving() || !canSave()"
      (click)="save.emit()"
    >
      @if (saving()) {
        <span class="document-command-bar__spinner" aria-hidden="true"></span>
      }
      Save
    </button>

    <button
      type="button"
      class="document-command-bar__button"
      [disabled]="saving() || !canSave()"
      (click)="saveAndNew.emit()"
    >
      Save + New
    </button>
  }
</div>
