<div class="app-context-menu">
  <ng-content />

  @if (showTrigger()) {
    <button
      type="button"
      class="app-context-menu__trigger"
      [attr.aria-label]="label()"
      aria-haspopup="menu"
      (click)="open($event)"
      (keydown)="onKeydown($event)"
    >
      <svg class="app-context-menu__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="3.5" r="1.3" fill="currentColor" />
        <circle cx="8" cy="8" r="1.3" fill="currentColor" />
        <circle cx="8" cy="12.5" r="1.3" fill="currentColor" />
      </svg>
    </button>
  }

  <p-contextmenu
    [model]="items()"
    [appendTo]="'body'"
    styleClass="app-context-menu__panel"
    [pt]="menuPassThrough"
    (onShow)="onShow()"
    (onHide)="onHide()"
  />
</div>
