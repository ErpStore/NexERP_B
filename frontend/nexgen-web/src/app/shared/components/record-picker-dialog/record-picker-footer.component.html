<div class="app-record-picker__footer">
  <p class="app-record-picker__summary" role="status" aria-live="polite">{{ summary() }}</p>

  @if (disabled()) {
    <p class="app-record-picker__hint" [id]="hintId">Select at least one record to continue.</p>
  }

  <span class="app-record-picker__footer-actions">
    @if (canExport()) {
      <button
        type="button"
        class="app-record-picker__button"
        [disabled]="exporting()"
        (click)="exported.emit()"
      >
        {{ exporting() ? 'Exporting…' : exportLabel() }}
      </button>
    }

    <button type="button" class="app-record-picker__button" (click)="cancelled.emit()">
      {{ cancelLabel() }}
    </button>

    <button
      type="button"
      class="app-record-picker__button app-record-picker__button--confirm"
      [disabled]="disabled()"
      [attr.aria-describedby]="disabled() ? hintId : null"
      (click)="confirmed.emit()"
    >
      {{ confirmLabel() }}
    </button>
  </span>
</div>
