<div class="app-tabs" role="tablist">
  @for (tab of tabs(); track tab.id; let i = $index) {
    <button
      type="button"
      class="app-tabs__tab"
      [id]="tabDomId(tab)"
      [class.app-tabs__tab--active]="activeId() === tab.id"
      role="tab"
      [attr.aria-selected]="activeId() === tab.id"
      [attr.aria-controls]="panelDomId(tab)"
      [attr.tabindex]="activeId() === tab.id ? 0 : -1"
      (click)="select(tab)"
      (keydown)="onKeydown($event, i)"
    >
      {{ tab.label }}
    </button>
  }
</div>
