<div
  class="app-choice-group"
  role="radiogroup"
  [attr.aria-labelledby]="field?.labelId()"
  [attr.aria-label]="field ? null : ariaLabel()"
>
  @for (option of options(); track option.value; let i = $index) {
    <div class="app-choice">
      <p-radiobutton
        [name]="groupName"
        [value]="option.value"
        [inputId]="optionId(i)"
        [disabled]="isDisabled() || readonly() || (option.disabled ?? false)"
        [ngModel]="value()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="onModelChange($event)"
      />
      <label class="app-choice__label" [attr.for]="optionId(i)">{{ option.label }}</label>
    </div>
  }
</div>
