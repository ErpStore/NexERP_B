<div class="app-file-upload">
  <p-fileupload
    mode="basic"
    [customUpload]="true"
    [auto]="false"
    [multiple]="multiple()"
    [accept]="accept()"
    [maxFileSize]="maxFileSize()"
    [chooseLabel]="chooseLabel()"
    [disabled]="isDisabled() || readonly()"
    (onSelect)="onSelect($event)"
    (onError)="onError()"
  />

  @if (accept()) {
    <p class="app-file-upload__accepts">Accepted types: {{ accept() }}</p>
  }

  @if (rejected(); as message) {
    <p class="app-error-row" role="alert">{{ message }}</p>
  }

  @if (files().length === 0) {
    <p class="app-empty-row">No files attached yet.</p>
  } @else {
    <ul class="app-file-upload__list">
      @for (file of files(); track file.name + file.size; let i = $index) {
        <li class="app-file-upload__item">
          <span class="app-file-upload__name">{{ file.name }}</span>
          <button
            type="button"
            class="app-retry"
            [disabled]="isDisabled() || readonly()"
            [attr.aria-label]="'Remove ' + file.name"
            (click)="remove(i)"
          >
            Remove
          </button>
        </li>
      }
    </ul>
  }
</div>
