<p-multiselect
  class="app-control"
  [options]="visibleOptions()"
  optionLabel="label"
  optionValue="value"
  optionDisabled="disabled"
  [inputId]="inputId()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [invalid]="field?.invalid() ?? false"
  [filter]="filter()"
  display="chip"
  [ngModel]="value() ?? []"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onModelChange($event)"
  (onBlur)="markTouched()"
  (keydown)="onKeyDown($event)"
>
  <ng-template #empty>
    @if (loading()) {
      <div class="app-loading-row" role="status">Loading options…</div>
    } @else if (errorMessage()) {
      <div class="app-error-row" role="alert">{{ errorMessage() }}</div>
    } @else {
      <div class="app-empty-row">{{ emptyMessage() }}</div>
    }
  </ng-template>
</p-multiselect>
