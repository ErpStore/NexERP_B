<input
  pInputText
  class="app-control"
  [attr.id]="inputId()"
  [attr.type]="inputType()"
  [attr.placeholder]="placeholder()"
  [attr.aria-label]="ariaLabel()"
  [attr.maxlength]="maxlength()"
  [value]="value() ?? ''"
  [disabled]="isDisabled()"
  [readOnly]="readonly()"
  (input)="onInput($event)"
  (blur)="onBlur()"
/>
