<div class="app-amount-or-percent">
  <p-inputnumber
    class="app-control"
    inputStyleClass="app-control app-control--numeric"
    [inputId]="inputId()"
    [placeholder]="placeholder()"
    [ariaLabel]="ariaLabel()"
    [minFractionDigits]="scale()"
    [maxFractionDigits]="scale()"
    [disabled]="isDisabled() || decimalUnavailable()"
    [readonly]="readonly()"
    [invalid]="field?.invalid() ?? false"
    [ngModel]="displayNumber()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onNumberChange($event)"
    (onBlur)="markTouched()"
  />

  <p-selectbutton
    class="app-amount-or-percent__mode"
    [options]="modeOptions()"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    [disabled]="isDisabled() || readonly()"
    [ariaLabelledBy]="field?.labelId()"
    [ngModel]="isAmount()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onModeChange($event)"
  />
</div>

@if (decimalUnavailable()) {
  <p class="app-control-notice" role="status">
    Numeric entry is unavailable until the decimal module (M2-C10) is provided.
  </p>
}
