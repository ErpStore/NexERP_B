<div class="form-layout">
  @if (formErrors().length > 0) {
    <!--
      TODO(M2-C04-03): replace with the shared InlineAlert. This is a minimal
      placeholder, not a second alert system - the markup here is form-LEVEL,
      not field-level, so it does not compete with app-form-field.
      The server's message is shown verbatim: those strings are product UX.
    -->
    <div class="form-layout__alert" role="alert">
      <ul class="form-layout__alert-list">
        @for (message of formErrors(); track message) {
          <li>{{ message }}</li>
        }
      </ul>
    </div>
  }

  @if (loading()) {
    <div
      class="form-layout__grid"
      [style.grid-template-columns]="'repeat(' + columnCount() + ', minmax(0, 1fr))'"
      aria-busy="true"
      aria-label="Loading form"
    >
      @for (row of skeletonRows(); track row) {
        <div class="form-layout__skeleton">
          <span class="form-layout__skeleton-label"></span>
          <span class="form-layout__skeleton-control"></span>
        </div>
      }
    </div>
  } @else {
    <div
      class="form-layout__grid"
      [style.grid-template-columns]="'repeat(' + columnCount() + ', minmax(0, 1fr))'"
    >
      <ng-content />
    </div>
  }

  <footer class="form-layout__actions">
    <ng-content select="[formActions]" />
  </footer>
</div>
