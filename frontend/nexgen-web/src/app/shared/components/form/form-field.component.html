<div class="form-field" [class.form-field--invalid]="invalid()">
  <label
    class="form-field__label"
    [id]="labelId()"
    [attr.for]="usesGroupLabel() ? null : controlId()"
  >
    {{ label() }}
    @if (isRequired()) {
      <span class="form-field__required" aria-hidden="true">*</span>
    }
  </label>

  <div class="form-field__control">
    <ng-content />
  </div>

  @if (hint()) {
    <p class="form-field__hint" [id]="hintId()">{{ hint() }}</p>
  }

  <!--
    The live region is always in the DOM. A region inserted at the same moment
    as its text is not reliably announced, so the element is permanent and
    only its contents change.
    Error is never colour-only: icon plus words (WCAG 1.4.1).
  -->
  <p class="form-field__error" [id]="errorId()" role="status" aria-live="polite">
    @if (invalid() && errorText()) {
      <svg class="form-field__error-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.4v4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="8" cy="11.4" r="0.9" fill="currentColor" />
      </svg>
      <span class="form-field__error-text">{{ errorText() }}</span>
    }
  </p>
</div>
