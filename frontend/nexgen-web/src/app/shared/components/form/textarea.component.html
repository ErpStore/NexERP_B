<textarea
  pTextarea
  class="app-control app-control--multiline"
  [attr.id]="inputId()"
  [attr.placeholder]="placeholder()"
  [attr.aria-label]="ariaLabel()"
  [attr.maxlength]="maxlength()"
  [rows]="rows()"
  [value]="value() ?? ''"
  [disabled]="isDisabled()"
  [readOnly]="readonly()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>
