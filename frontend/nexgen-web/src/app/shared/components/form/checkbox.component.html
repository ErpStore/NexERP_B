<div class="app-choice">
  <p-checkbox
    [binary]="true"
    [inputId]="inputId()"
    [disabled]="isDisabled()"
    [readonly]="readonly()"
    [ngModel]="value() ?? false"
    [ngModelOptions]="{ standalone: true }"
    [ariaLabel]="ariaLabel()"
    (ngModelChange)="onModelChange($event)"
  />
  @if (optionLabel()) {
    <label class="app-choice__label" [attr.for]="inputId()">{{ optionLabel() }}</label>
  }
</div>
