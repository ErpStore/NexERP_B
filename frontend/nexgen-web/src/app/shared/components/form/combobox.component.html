<p-autocomplete
  class="app-control"
  [suggestions]="suggestionList()"
  optionLabel="label"
  [inputId]="inputId()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [invalid]="field?.invalid() ?? false"
  [delay]="0"
  [showClear]="!readonly()"
  [forceSelection]="true"
  [autoOptionFocus]="true"
  [showEmptyMessage]="true"
  [ngModel]="value()"
  [ngModelOptions]="{ standalone: true }"
  (completeMethod)="onComplete($event)"
  (onSelect)="onSelect($event.value)"
  (onClear)="onClear()"
  (onBlur)="markTouched()"
  (onHide)="onPanelHide()"
>
  <!--
    The three states live INSIDE the dropdown. A blocking overlay for a
    typeahead is worse than no feedback: it steals the keyboard.
  -->
  <ng-template #empty>
    @if (loading()) {
      <div class="app-loading-row" role="status">Searching…</div>
    } @else if (errorMessage()) {
      <div class="app-error-row" role="alert">
        <span>{{ errorMessage() }}</span>
        <button type="button" class="app-retry" (click)="retry()">Retry</button>
      </div>
    } @else if (searched()) {
      <div class="app-empty-row">No results for &ldquo;{{ lastQuery() }}&rdquo;</div>
    } @else {
      <div class="app-empty-row">Type to search</div>
    }
  </ng-template>
</p-autocomplete>
