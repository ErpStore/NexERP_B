<div
  class="app-skeleton-form"
  role="status"
  aria-live="polite"
  [attr.aria-label]="label()"
  [attr.data-fields]="fields()"
  [attr.data-columns]="columns()"
  [style.--app-skeleton-form-columns]="columns()"
>
  @for (field of fieldIndexes(); track field) {
    <div class="app-skeleton-form__field">
      <app-skeleton width="40%" height="var(--text-sm)" />
      <app-skeleton height="var(--control-height)" />
    </div>
  }
</div>
