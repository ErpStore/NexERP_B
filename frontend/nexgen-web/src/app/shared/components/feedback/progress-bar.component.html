@if (indeterminate()) {
  <!--
    The `value` input is deliberately not bound here. PrimeNG transforms it
    with `numberAttribute`, so binding `undefined` renders
    `aria-valuenow="NaN"` - measured, not assumed - and a screen reader would
    read a position that does not exist. Leaving the input alone omits the
    attribute, which is what "indeterminate" means.
  -->
  <p-progressbar mode="indeterminate" [pt]="passThrough" [attr.aria-label]="label()" />
} @else {
  <p-progressbar
    mode="determinate"
    [pt]="passThrough"
    [value]="value()"
    [showValue]="showValue()"
    [attr.aria-label]="label()"
  />
}
