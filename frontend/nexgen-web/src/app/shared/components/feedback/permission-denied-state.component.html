<div class="app-permission-denied-state" role="status">
  <svg
    class="app-permission-denied-state__art"
    viewBox="0 0 48 32"
    aria-hidden="true"
    focusable="false"
  >
    <rect
      x="17"
      y="14"
      width="14"
      height="11"
      rx="2"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    />
    <path
      d="M20 14v-3a4 4 0 0 1 8 0v3"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </svg>

  <h2 class="app-permission-denied-state__title">{{ title() }}</h2>

  <p class="app-permission-denied-state__detail">
    You do not have the
    <span class="app-permission-denied-state__right">{{ right() }}</span>
    right for the
    <span class="app-permission-denied-state__right">{{ screen() }}</span>
    screen. Ask an administrator to grant it.
  </p>
</div>
