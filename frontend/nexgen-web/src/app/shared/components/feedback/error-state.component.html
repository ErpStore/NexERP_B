<div class="app-error-state" role="alert">
  <svg class="app-error-state__art" viewBox="0 0 48 32" aria-hidden="true" focusable="false">
    <circle cx="24" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.5" />
    <path d="M24 10v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="24" cy="21" r="1.1" fill="currentColor" />
  </svg>

  <h2 class="app-error-state__title">{{ title() }}</h2>

  <!-- The server's words, unaltered. -->
  <p class="app-error-state__message">{{ message() }}</p>

  @if (detail()) {
    <p class="app-error-state__message">{{ detail() }}</p>
  }

  @if (traceId()) {
    <p class="app-error-state__trace">
      <span>Reference: {{ traceId() }}</span>
      <button type="button" class="app-error-state__button" (click)="copyTraceId()">
        {{ copyState() ? 'Copied' : 'Copy reference' }}
      </button>
    </p>
  }

  <div class="app-error-state__actions">
    @if (showRetry()) {
      <button type="button" class="app-error-state__button" (click)="retry.emit()">Retry</button>
    }
  </div>
</div>
