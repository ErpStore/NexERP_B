<div #region class="app-busy-overlay__region" [attr.aria-busy]="busy()">
  <ng-content />
</div>

<p-blockui [blocked]="busy()" [target]="fullPage() ? null : self" styleClass="app-busy-overlay">
  <div class="app-busy-overlay__panel">
    <p-progressspinner [ariaLabel]="message()" strokeWidth="4" />
    <p class="app-busy-overlay__message" role="status" aria-live="polite">{{ message() }}</p>
  </div>
</p-blockui>
