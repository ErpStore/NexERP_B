<div class="app-empty-state" role="status" [attr.data-variant]="variant()">
  <!-- Illustration, decorative: the words carry the meaning. -->
  <svg class="app-empty-state__art" viewBox="0 0 48 32" aria-hidden="true" focusable="false">
    <rect
      x="2"
      y="4"
      width="44"
      height="24"
      rx="2"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    />
    <path d="M8 12h20M8 18h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    @if (isFiltered()) {
      <path
        d="M32 12h10l-4 5v5l-2-1v-4z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    }
  </svg>

  <h2 class="app-empty-state__title">{{ title() }}</h2>

  @if (description()) {
    <p class="app-empty-state__description">{{ description() }}</p>
  }

  <div class="app-empty-state__actions">
    @if (isFiltered()) {
      <button type="button" class="app-empty-state__button" (click)="clearFilters.emit()">
        Clear filters
      </button>
    } @else if (actionLabel()) {
      <button
        type="button"
        class="app-empty-state__button app-empty-state__button--primary"
        (click)="action.emit()"
      >
        {{ actionLabel() }}
      </button>
    }
  </div>
</div>
