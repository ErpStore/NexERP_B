@if (visible()) {
  <p-message
    [severity]="severity()"
    [closable]="false"
    [pt]="passThrough()"
    styleClass="app-inline-alert"
  >
    <div class="app-inline-alert__content">
      <!-- Icon plus text, never colour alone (WCAG 1.4.1). -->
      <svg class="app-inline-alert__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        @switch (severity()) {
          @case ('success') {
            <path
              d="M3 8.5 6.5 12 13 4.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          }
          @case ('warn') {
            <path
              d="M8 2 15 14H1z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path d="M8 6.2v3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="8" cy="11.8" r="0.9" fill="currentColor" />
          }
          @case ('error') {
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          }
          @default {
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 7.2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="8" cy="4.7" r="0.9" fill="currentColor" />
          }
        }
      </svg>

      <span class="app-inline-alert__severity">{{ severityLabel() }}:</span>
      <span class="app-inline-alert__message">{{ message() }}</span>

      @if (dismissible()) {
        <button type="button" class="app-inline-alert__dismiss" (click)="dismiss()">Dismiss</button>
      }
    </div>
  </p-message>
}
