<div
  class="app-skeleton-table"
  role="status"
  aria-live="polite"
  [attr.aria-label]="label()"
  [attr.data-rows]="rows()"
  [attr.data-columns]="columns()"
  [style.--app-skeleton-columns]="columns()"
>
  @if (showHeader()) {
    <div class="app-skeleton-table__row app-skeleton-table__row--header">
      @for (column of columnIndexes(); track column) {
        <app-skeleton height="var(--text-sm)" />
      }
    </div>
  }

  @for (row of rowIndexes(); track row) {
    <div class="app-skeleton-table__row">
      @for (column of columnIndexes(); track column) {
        <app-skeleton height="var(--text-base)" />
      }
    </div>
  }
</div>
