<div class="app-data-grid-pagination">
  <span class="app-data-grid-pagination__range">{{ rangeLabel() }}</span>

  <div class="app-data-grid-pagination__size">
    <span class="app-data-grid-pagination__size-label" aria-hidden="true">Rows per page</span>
    <app-select
      [options]="sizeOptions()"
      [showClear]="false"
      ariaLabel="Rows per page"
      [ngModel]="pageSize()"
      [ngModelOptions]="{ standalone: true }"
      [disabled]="disabled()"
      (ngModelChange)="onPageSizeChange($event)"
    />
  </div>

  <nav class="app-data-grid-pagination__nav" aria-label="Pagination">
    <button
      type="button"
      class="app-data-grid-pagination__button"
      aria-label="First page"
      [disabled]="disabled() || onFirstPage()"
      (click)="goTo(1)"
    >
      &laquo;
    </button>
    <button
      type="button"
      class="app-data-grid-pagination__button"
      aria-label="Previous page"
      [disabled]="disabled() || onFirstPage()"
      (click)="goTo(page() - 1)"
    >
      &lsaquo;
    </button>
    <span class="app-data-grid-pagination__position">Page {{ page() }} of {{ totalPages() }}</span>
    <button
      type="button"
      class="app-data-grid-pagination__button"
      aria-label="Next page"
      [disabled]="disabled() || onLastPage()"
      (click)="goTo(page() + 1)"
    >
      &rsaquo;
    </button>
    <button
      type="button"
      class="app-data-grid-pagination__button"
      aria-label="Last page"
      [disabled]="disabled() || onLastPage()"
      (click)="goTo(totalPages())"
    >
      &raquo;
    </button>
  </nav>
</div>
