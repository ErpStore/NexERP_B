<!--
  One `role="status"` for the whole region, with a visually-hidden label. The
  bars themselves are hidden from the accessibility tree by `app-skeleton`.
-->
<div class="app-data-grid__skeleton" role="status" [attr.data-rows]="rowCount()">
  <span class="app-data-grid__announcement">{{ label() }}</span>

  @for (row of rowIndexes(); track row) {
    <div class="app-data-grid__skeleton-row" [style.height.px]="rowHeightPx()">
      @for (lead of leadingIndexes(); track lead) {
        <span class="app-data-grid__skeleton-cell" style="width: 40px">
          <app-skeleton width="16px" height="16px" />
        </span>
      }
      @for (column of columns(); track column.field) {
        <span
          class="app-data-grid__skeleton-cell"
          [attr.data-field]="column.field"
          [style.width]="width(column)"
        >
          <app-skeleton width="100%" height="var(--text-base)" />
        </span>
      }
    </div>
  }
</div>
