@switch (kind()) {
  @case ('loading') {
    <app-data-grid-skeleton
      [columns]="columns()"
      [columnWidths]="columnWidths()"
      [pageSize]="pageSize()"
      [rowHeightPx]="rowHeightPx()"
      [leadingCells]="leadingCells()"
    />
  }
  @case ('error') {
    <app-data-grid-error [error]="error()" (retry)="retry.emit()" />
  }
  @default {
    <div class="app-data-grid__state">
      <app-empty-state
        [variant]="kind() === 'filtered-empty' ? 'filtered' : 'no-data'"
        [title]="title()"
        [description]="description()"
        [actionLabel]="emptyActionLabel()"
        (action)="emptyAction.emit()"
        (clearFilters)="clearFilters.emit()"
      />
    </div>
  }
}
