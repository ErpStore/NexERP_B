<div class="app-data-grid__toolbar-actions">
  <button
    #exportTrigger
    pButton
    type="button"
    class="app-data-grid__toolbar-button"
    [disabled]="exporter.exporting()"
    [attr.aria-busy]="exporter.exporting()"
    [attr.aria-haspopup]="singleFormat() ? null : 'menu'"
    (click)="onTriggerClick($event)"
  >
    {{ label() }}
  </button>

  @if (!singleFormat()) {
    <p-menu #exportMenu [model]="menuItems()" [popup]="true" />
  }

  <!-- A spinner alone says nothing to a screen reader. -->
  @if (exporter.exporting()) {
    <span class="app-data-grid__announcement" role="status">{{ busyLabel() }}</span>
  }
</div>

@if (exporter.error()) {
  <!-- The server's message, not a generic one (KB-051 principle 6). -->
  <app-data-grid-error [error]="exporter.error()" [showRetry]="false" />
}
