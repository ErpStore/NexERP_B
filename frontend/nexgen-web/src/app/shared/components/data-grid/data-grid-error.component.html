<div class="app-data-grid__state" [attr.aria-live]="liveness()" [attr.data-status]="status()">
  @if (isPermissionDenied()) {
    <app-permission-denied-state [screen]="screen()" [right]="right()" />
  } @else if (isBusinessRule()) {
    <!--
      The server's sentence, interpolated and nothing else. No prefix, no
      translation pipe, no truncation (BR-SO-001, `MfgPoService.cs:488`).
    -->
    <app-inline-alert severity="error" [message]="message()" />
  } @else {
    <app-error-state
      [message]="message()"
      [detail]="detail()"
      [traceId]="traceId()"
      [showRetry]="showRetry()"
      (retry)="retry.emit()"
    />
  }
</div>
