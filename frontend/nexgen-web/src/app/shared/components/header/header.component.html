<header class="app-header">
  <div class="app-header__start">
    <button
      type="button"
      class="app-header__icon-button"
      aria-label="Toggle navigation menu"
      (click)="menuToggled.emit()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    <span class="app-header__mark">NexGen ERP</span>
    <button
      type="button"
      class="app-header__search"
      aria-label="Search (Ctrl+K)"
      (click)="searchRequested.emit()"
    >
      <i class="pi pi-search" aria-hidden="true"></i>
      <span>Search</span>
      <kbd class="app-header__kbd">Ctrl K</kbd>
    </button>
  </div>

  <div class="app-header__end">
    @if (!compactIdentity()) {
      <app-financial-year-selector />
      @if (tenantName()) {
        <span class="app-header__tenant">{{ tenantName() }}</span>
      }
    }
    <button type="button" class="app-header__icon-button" aria-label="Notifications" disabled>
      <i class="pi pi-bell" aria-hidden="true"></i>
    </button>
    <app-theme-toggle />
    <app-user-menu [userName]="userName()" (logoutRequested)="logoutRequested.emit()">
      @if (compactIdentity()) {
        <div appUserMenuExtra class="app-header__menu-extra">
          <app-financial-year-selector />
          @if (tenantName()) {
            <span class="app-header__tenant">{{ tenantName() }}</span>
          }
        </div>
      }
    </app-user-menu>
  </div>
</header>
