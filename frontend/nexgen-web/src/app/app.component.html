<router-outlet />

<!--
  One toast host and one confirm-dialog host for the whole application
  (M2-C04-03). Screens never place their own: a second host means a message
  can appear twice, or in the wrong stacking context.
-->
<p-toast position="bottom-right" [breakpoints]="toastBreakpoints" [pt]="toastPassThrough" />

<!--
  The confirm host is deferred (M2-C13) so p-confirmdialog, p-dialog,
  app-form-field and app-textarea leave the initial chunk (R-69). It is still
  exactly one host: the trigger latches on the first confirm() and never goes
  back, and ConfirmDialogService queues that first request until this host has
  mounted and subscribed - PrimeNG's requireConfirmation$ is a plain Subject
  and would otherwise drop it.
-->
@defer (when confirmHostRequested()) {
  <app-confirm-dialog />
}

<!--
  M2-C02 — one idle-warning host for the whole application, mounted alongside the router
  outlet so it stays visible regardless of route. Deferred until the first authenticated
  session for the same R-69 reason confirm-dialog above already is: an anonymous caller on
  `/login` never needs its PrimeNG dialog dependency in the initial chunk.
-->
@defer (when idleWarningRequested()) {
  <app-idle-warning />
}
