@if (hasNoRights()) {
  <app-empty-state
    title="Your account has no screen permissions yet."
    description="Contact your administrator."
  />
} @else if (!dashboardRight().view) {
  <app-permission-denied-state screen="Dashboard" right="view" />
} @else {
  <app-page-header title="Dashboard" />
  <div class="app-dashboard__body">
    <p>{{ appName }}</p>
    <p data-testid="build-version">Version {{ version }}</p>
  </div>
}
