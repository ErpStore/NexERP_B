<div class="app-login">
  <form class="app-login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="app-login__title">Sign in</h1>

    @if (errorMessage(); as message) {
      <app-inline-alert severity="error" [message]="message" />
    }

    <app-form-field label="Tenant">
      <app-text-input formControlName="tenant" />
    </app-form-field>

    <app-form-field label="Username">
      <app-text-input formControlName="username" />
    </app-form-field>

    <app-form-field label="Password">
      <app-text-input formControlName="password" inputType="password" />
    </app-form-field>

    <button type="submit" class="app-login__submit" [disabled]="submitting()">
      @if (submitting()) {
        Signing in…
      } @else {
        Sign in
      }
    </button>
  </form>
</div>
