<app-modal
  title="Session expiring"
  [visible]="idleTimeout.isWarning()"
  [closable]="true"
  (closed)="staySignedIn()"
>
  <p>
    You will be signed out in
    <strong aria-live="polite">{{ idleTimeout.secondsRemaining() }}</strong>
    seconds due to inactivity.
  </p>
  <div appModalFooter>
    <button type="button" class="app-idle-warning__stay" (click)="staySignedIn()">
      Stay signed in
    </button>
  </div>
</app-modal>
