<p-toast />

<div class="login-page">
  <p-card styleClass="login-card">
    <ng-template pTemplate="header">
      <div class="login-brand">
        <h1>NexGenERP</h1>
        <p>Angular frontend — Module 1 (Currency)</p>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="username">Username</label>
      <input
        id="username"
        pInputText
        class="w-full"
        formControlName="username"
        autocomplete="username"
      />

      <label for="password">Password</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="current-password"
      />

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <p-button
        type="submit"
        label="Sign in"
        styleClass="w-full mt-3"
        [loading]="loading()"
        [disabled]="loading()"
      />
    </form>

    <p class="hint">
      API must be running at <code>http://localhost:5144</code>.
      After login you will open <a routerLink="/currency">Currency Master</a>.
    </p>
  </p-card>
</div>
