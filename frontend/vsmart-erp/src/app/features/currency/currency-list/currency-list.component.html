<p-toast />
<p-confirmDialog />

<p-card header="Currency List">
  <div class="toolbar">
    <input
      pInputText
      placeholder="Search currency name..."
      [(ngModel)]="currName"
      (keyup.enter)="search()"
    />

    <p-select
      [options]="pageSizeOptions"
      [(ngModel)]="pageSize"
      optionLabel="label"
      optionValue="value"
      (onChange)="onPageSizeChange()"
    />

    <p-button label="Search" icon="pi pi-search" (onClick)="search()" />
    <p-button label="Refresh" icon="pi pi-refresh" [outlined]="true" (onClick)="refresh()" />
    <p-button label="Add New" icon="pi pi-plus" severity="success" routerLink="/currency/create" />
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p-table [value]="rows()" [loading]="loading()" styleClass="p-datatable-sm p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Sub</th>
        <th>Symbol</th>
        <th>System</th>
        <th>Created By</th>
        <th>Created</th>
        <th style="width: 8rem">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.currId }}</td>
        <td>{{ row.currName }}</td>
        <td>{{ row.currSub }}</td>
        <td>{{ row.symbol }}</td>
        <td>
          <p-tag
            [value]="row.isSystemDefined ? 'System' : 'User'"
            [severity]="row.isSystemDefined ? 'warn' : 'success'"
          />
        </td>
        <td>{{ row.createdBy }}</td>
        <td>{{ row.createdDate | date: 'dd/MM/yyyy' }}</td>
        <td class="actions">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            [routerLink]="['/currency/edit', row.currId]"
          />
          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            [disabled]="row.isSystemDefined"
            (onClick)="confirmDelete(row)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8">No currencies found.</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="pager">
    <span>Total: {{ totalCount() }}</span>
    <div class="pager-buttons">
      <p-button label="Prev" [outlined]="true" size="small" (onClick)="prevPage()" />
      <span>Page {{ pageNumber }}</span>
      <p-button label="Next" [outlined]="true" size="small" (onClick)="nextPage()" />
    </div>
  </div>
</p-card>
